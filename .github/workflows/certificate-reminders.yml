name: Certificate Expiry Reminders

on:
  schedule:
    # 00:10 UTC = 台灣時間每日 08:10。
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake Render API
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors \
            "https://engineer-department-platform.onrender.com/health"
      - name: Send certificate expiry reminders
        env:
          M365_WEBHOOK_TOKEN: ${{ secrets.M365_WEBHOOK_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-M365-Webhook-Token: ${M365_WEBHOOK_TOKEN}" \
            "https://engineer-department-platform.onrender.com/api/certificates/reminders/run"
